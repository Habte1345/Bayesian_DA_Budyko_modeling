# config.yaml
scenario: all   # all | base | budyko | budyko_da

paths:
  data_dir: data/processed
  result_dir: Simulation_results
  calibrated_params: SCE_cal_params/calibrated_params.json
  global_calibrated_params: SCE_global_params/global_calibrated_params.json
# Data assimilation config
da:
  enabled: true
  nens: 300
  inflation: 1.20
  R_ET_std: 0.4      # ~25% of mean ET (1.74 mm/month)
  R_Q_std: 0.5       # ~28% of mean Q  (1.77 mm/month)
  R_ET_frac: 0.20    # relative floor: 20% of observation — scales with large events
  R_Q_frac: 0.20     # relative floor: 20% of observation
  proc_S_std: 3.0    # fine — absolute mm, 2% of typical Smax
  proc_G_std: 5.0    # fine — absolute mm
  P_std_frac: 0.25
  PET_std_frac: 0.10

  
parallel:
  enabled: true
  max_workers: -1

basins:
  subset: null

# Default run mode if CLI not provided
param_mode: Simulation_with_BASIN_CALIB_PARAMS   # Simulation_with_BASIN_CALIB_PARAMS | Simulation_with_GLOBAL_CAL_PARAMS

# Parameter configs (canonical keys!)
# params:
#   CALIBRATED:
#     use_calibrated: true

# #   UNCALIBRATED:
# #     use_calibrated: false
# #     random_seed: 1234

params:
  CALIBRATED:
    use_calibrated: true
  UNCALIBRATED:
    use_calibrated: false
    random_seed: 1234
    n_trials: 10      
    save_top_k: 5         
    bounds:
      Kperc: [0.1, 0.3]
      Kb: [0.01, 0.3]
      Ke: [0.1, 0.99]
      Cqq: [0.1, 0.90]
      Smax: [50, 800]
      Gmax_factor: [0.5, 20]
      fS0: [0.1, 0.9]
      fG0: [0.1, 0.8]


